name: Daily Bets Reconciliation Cron

on:
  schedule:
    # Se ejecuta todos los días a las 23:00 UTC (6:00 PM Colombia)
    - cron: '0 23 * * *'
  workflow_dispatch: # Permite ejecución manual desde GitHub

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas libsql-experimental streamlit

      - name: Run Reconciliation Script
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import os
          import streamlit as st

          # Inyectar variables de entorno de GitHub Secrets en st.secrets
          st.secrets['TURSO_DATABASE_URL'] = os.getenv('TURSO_DATABASE_URL', '')
          st.secrets['TURSO_AUTH_TOKEN'] = os.getenv('TURSO_AUTH_TOKEN', '')
          st.secrets['TELEGRAM_BOT_TOKEN'] = os.getenv('TELEGRAM_BOT_TOKEN', '')
          st.secrets['TELEGRAM_CHAT_ID'] = os.getenv('TELEGRAM_CHAT_ID', '')

          from core.api_client import APIFootballClient
          from core.reconciliation import reconcile_daily_bets

          client = APIFootballClient(api_key=os.environ['API_FOOTBALL_KEY'])
          result = reconcile_daily_bets(client)
          print(result)
          "
