name: Sync Data & Generate Bets

on:
  schedule:
    # Se ejecutará automáticamente cada hora (puedes ajustarlo si prefieres otro intervalo)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Para seguir pudiendo correrlo a mano cuando quieras

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Aseguramos dependencias clave para la sincronización y la base de datos
          pip install requests requests-cache libsql-experimental pytz streamlit

      - name: Run Data Synchronization
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python scripts/sync_data.py
