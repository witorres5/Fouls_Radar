name: Daily Bets Reconciliation Cron

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests-cache libsql-experimental streamlit

      - name: Run Reconciliation Script
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import os
          from core.api_client import APIFootballClient
          from core.reconciliation import reconcile_daily_bets
          from core.notifications import send_telegram_alert

          client = APIFootballClient(api_key=os.environ.get('API_FOOTBALL_KEY', ''))
          result = reconcile_daily_bets(client)
          print('Resultado:', result)

          # Enviar notificación del resultado
          msg = f'🤖 *Reconciliación Automática (GitHub Actions)*\n\n📌 *Estado:* {result}'
          send_telegram_alert(msg)
          "
